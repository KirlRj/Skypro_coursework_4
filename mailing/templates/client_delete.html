{% extends 'base.html' %}

{% block content %}
<h1>Удалить клиента</h1>
<p>Вы уверены, что хотите удалить <b>{{ client.full_name }}</b>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'mailing:clients' %}">Отмена</a>
</form>
{% endblock %}
