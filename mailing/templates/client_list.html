{% extends 'base.html' %}

{% block content %}
<h1>Клиенты</h1>
<a href="{% url 'mailing:client_create' %}">Добавить клиента</a>
<ul>
    {% for client in clients %}
    <li>
        <a href="{% url 'mailing:client_detail' pk=client.pk %}">{{ client.full_name }}</a>
        — {{ client.email }}
    </li>
    {% empty %}
    <li>Клиентов пока нет</li>
    {% endfor %}
</ul>
{% endblock %}
