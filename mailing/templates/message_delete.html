{% extends 'base.html' %}

{% block content %}
<h1>Удалить сообщение</h1>
<p>Вы уверены, что хотите удалить <b>{{ message.topic }}</b>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'mailing:messages' %}">Отмена</a>
</form>
{% endblock %}
